

services:
  postgres:
    image: postgres:16

    container_name: notifyx-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: notifyx
      POSTGRES_PASSWORD: notifyx
      POSTGRES_DB: notifyx

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: